<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cinema booking ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎬 Cinema ticket booking system</h1>

    <label for="name">Name:</label>
    <input type="text" id="name" name="Name" placeholder="enter your name..">
    <br>
    <br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="Age" placeholder="enter your age..">
    <br>
    <br>
    <label for="tickets">Tickets number:</label>
    <input type="number" id="ticket" name="Tickets" placeholder="enter a ticket number..">
    <br>
    <br>
    <button onclick="calculateticket()">Calculate price</button>
    <button onclick="clearticket()">Clear</button>
    <div id="result"></div>
  <script src="script.js"></script> 
</body>
</html>
